[package]
name = "price-threshold-condition"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Keeper Network Contributors"]
description = "Reference implementation of a price-threshold condition contract for Soroban Keeper Network"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "keeper", "condition", "oracle", "price"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
keeper-registry = { path = "../../keeper-registry", features = ["testutils"] }
keeper-registry-test-support = { path = "../../verifiers/test-support", features = ["testutils"] }
